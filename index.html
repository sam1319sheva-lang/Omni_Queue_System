<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelompok Coder_Sukses</title>
<style>
  :root{
    --ink:#1a2233;
    --muted:#5b6472;
    --glass:rgba(255,255,255,0.55);
    --glass-strong:rgba(255,255,255,0.75);
    --glass-border:rgba(255,255,255,0.65);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#ffffff;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:64px 24px;
    position:relative;
    overflow-x:hidden;
  }
  .blob{position:fixed;border-radius:50%;filter:blur(60px);z-index:0;}
  .blob.b1{width:380px;height:380px;background:#bfe0ff;top:-120px;left:-100px;}
  .blob.b2{width:340px;height:340px;background:#ffd6e8;bottom:-100px;right:-80px;}
  .blob.b3{width:260px;height:260px;background:#d9c9ff;top:40%;left:50%;}

  .header{position:relative;z-index:1;text-align:center;margin-bottom:40px;}
  .header h1{margin:0;font-size:32px;color:var(--ink);}
  .header p{margin:6px 0 0;font-size:14px;color:var(--muted);}
  .row{
    position:relative;
    z-index:1;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:24px;
    max-width:960px;
  }
  .profile-link{text-decoration:none;color:inherit;}
  .card{
    width:220px;
    background:var(--glass);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--glass-border);
    border-radius:20px;
    padding:24px 18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    box-shadow:0 8px 32px rgba(31,41,55,0.1);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 14px 40px rgba(31,41,55,0.16);
  }
  .avatar{
    width:100px;height:100px;
    border-radius:30%;
    overflow:hidden;
    border:2px solid var(--glass-border);
    box-shadow:0 4px 16px rgba(31,41,55,0.15);
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .card h3{margin:0;font-size:16px;text-align:center;color:var(--ink);line-height:1.3;}
  .card span{font-size:13px;color:var(--muted);}
</style>
</head>
<body>

  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="header">
    <h1>OMNIQUE</h1>
    <p>Profiles</p>
  </div>

  <div class="row">

    <a class="profile-link" href="samuel.html">
      <div class="card">
        <div class="avatar"><img src="samuel.jpeg" alt="samuel"></div>
        <h3>Samuel Sheva<br></h3>
        <span>2025081037</span>
      </div>
    </a>

    <a class="profile-link" href="awan.html">
      <div class="card">
        <div class="avatar"><img src="awan.jpeg" alt="awan"></div>
        <h3>Saktiawan<br></h3>
        <span>2025081056</span>
      </div>
    </a>

    <a class="profile-link" href="zidan.html">
      <div class="card">
        <div class="avatar"><img src="zidan.jpeg" alt="zidan"></div>
        <h3>Ahmad Zidan<br></h3>
        <span>2025081049</span>
      </div>
    </a>

  </div>

</body>
</html>
